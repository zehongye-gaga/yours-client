  <script type="application/json" id="handbook-data">{"content":{"meta":{"title":"Yours Client 微内核实现手册","version":"0.2","date":"2026-10-24","commit":"35fdc969e4b6c48c48ed44717c7a018324e4dd88"},"chapters":[{"id":"overview","number":"00","title":"从哪里开始","subtitle":"目标、约束与阅读路径"},{"id":"boundaries","number":"01","title":"职责与架构","subtitle":"谁负责什么，能力在哪里运行"},{"id":"mechanisms","number":"02","title":"内核机制与扩展","subtitle":"Cordis 原生行为与产品扩展边界"},{"id":"scenarios","number":"03","title":"生命周期演练","subtitle":"逐步检查成功、取消与失败"},{"id":"interfaces","number":"04","title":"接口与进程","subtitle":"Context、RPC 与权限边界"},{"id":"upgrade","number":"05","title":"热升级与数据","subtitle":"注册切换、旧调用与持久化"},{"id":"decisions","number":"06","title":"决策工作台","subtitle":"选择方案，记录理由与证据"},{"id":"roadmap","number":"07","title":"实施与验收","subtitle":"小步交付，用行为证明正确性"},{"id":"questions","number":"08","title":"实现问题索引","subtitle":"按当前卡住的问题寻找答案"},{"id":"sources","number":"09","title":"源码与术语","subtitle":"固定版本的阅读路径与概念表"}],"confirmed":[["客户端","Electron · macOS Apple Silicon 首发"],["模型接入","客户端直连 OpenAI 兼容接口"],["插件来源","可信内置插件 + 本地导入"],["内核方向","直接复用 Cordis · 可修改本地分支"],["首个验收","GitHub 动态工作台"],["当前阶段","源码、构建、测试与生命周期样例已接通"]],"paths":[{"title":"先理解系统","text":"看职责边界，再区分包、实例、激活和进程。","target":"boundaries","action":"建立共同语言","number":"01"},{"title":"准备接入 Cordis","text":"先理解原生 API 和测试，再落实产品的服务与运行边界。","target":"mechanisms","action":"理解内核与扩展","number":"02"},{"title":"正在做取舍","text":"比较方案，写下理由和能推翻当前选择的证据。","target":"decisions","action":"记录架构决策","number":"03"}],"responsibilities":[{"need":"启用新插件","kernel":"Fiber、服务依赖与原生注册","outside":"Installer 准备代码；Runtime 加载入口","proof":"先装消费者、后装提供者，也能按依赖启动。"},{"need":"停止或卸载","kernel":"释放 Fiber、受管资源与消费者依赖","outside":"Supervisor 终止进程；安装层决定数据保留","proof":"停止后不再接受新调用，受管监听和任务被释放。"},{"need":"工作台个性化","kernel":"Context 派生与按服务键 isolate","outside":"Workspace 映射范围；Profile 选择启用；Policy 授权","proof":"两个 Workspace 可以解析到不同的服务实现。"},{"need":"动态工具与 UI","kernel":"用 effect 绑定业务资源清理","outside":"Tools / Views 实现暂存、提交、修订；Renderer 展示","proof":"激活结束才发布完整注册，停止时撤销入口。"},{"need":"业务插件升级","kernel":"管理新旧 Fiber 与受管资源","outside":"注册服务提交修订；部署预热；Broker 保留租约；Runtime 排空","proof":"一次 Agent Step 的工具定义与执行目标保持一致。"},{"need":"故障恢复与诊断","kernel":"失败状态、依赖原因、清理结果","outside":"宿主监控进程；策略决定重试；Storage 恢复数据","proof":"能解释为何没启动、为何停止，以及还有哪些资源未释放。"}],"layers":[{"label":"Cordis 本地分支","tag":"已引入","text":"沿用已有机制，后续可以按需要修改源码。","items":["Context / isolate / 服务","plugin / inject / Fiber","effect / Events / Logger"]},{"label":"领域服务","tag":"语义","text":"定义 Agent、工具、存储和界面的具体行为。","items":["Agent / Model Provider","Tools / Views / Storage","Policy / Profile Resolver"]},{"label":"宿主与运行环境","tag":"执行","text":"提供进程、系统访问、持久化及隔离。","items":["Electron / Supervisor","RPC / Capability Broker","文件系统 / 凭证 / Sandbox"]}],"identities":[{"name":"packageId + version","label":"代码包","example":"github-workbench@1.2.0","text":"不可变的发布单元。安装层保存代码和 Manifest。"},{"name":"instanceId","label":"启用实例","example":"workspace-a/github-main","text":"关联作用域与配置。停止或重启不必改变实例身份。"},{"name":"activationId","label":"一次激活","example":"github-main / generation 7","text":"产品运行代次，由 Runtime 发放。不同于 Cordis Fiber 的 uid 或内部 epoch。"},{"name":"scopeId","label":"可见范围","example":"root / workspace-a / session-2","text":"宿主定义的 Workspace / Session 范围，再映射到 Context 和服务隔离键。"}],"mechanisms":[{"id":"scope","name":"Context 与服务隔离","english":"Cordis service realms","color":"teal","question":"同一个服务名，在不同工作台里应该找到谁？","idea":"直接使用 Context.extend 与 isolate。isolate 按服务键选择 realm；产品 Workspace 需要明确映射，不自带通用的父级回退查找树。","structures":["Context.extend(meta)","Context.isolate(serviceKey, label)","Workspace → service realm mapping"],"steps":["先列出要按 Workspace 隔离的服务，以及允许共享的服务。","在同一 Workspace 中复用对应服务的 realm 标签。","插件的清理仍由 Fiber 和 effect 负责；Context 派生不等于独立生命周期。","跨范围共享或授权由宿主显式实现，必要时使用独立根 Context。"],"invariant":"隔离只覆盖明确配置的服务键。产品 scopeId、资源归属和调用权限不能混为同一件事。","trap":"以为 ctx.extend() 自动隔离所有服务，或以为 isolate() 提供一个自动向父级回退的 Scope 容器。","decide":"产品服务替换后，使用原生依赖重新激活，还是通过稳定代理保留旧目标？","decisionId":"D03","code":"// Cordis 原生 API；完整 Workspace 管理另行实现\nconst root = new Context();\nconst workspaceA = root.isolate('storage', Symbol('workspace-a'));\nconst workspaceB = root.isolate('storage', Symbol('workspace-b'));\nawait workspaceA.plugin(ctx => {\n  ctx.provide('storage', { workspaceId: 'a' });\n});\nawait workspaceA.inject(['storage'], ctx => {\n  console.log(ctx.storage.workspaceId); // a\n});\n// workspaceB 的 storage 属于另一个 realm。","sources":["https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/context.ts","https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/reflect.ts"],"codeLabel":"Cordis 原生 API · 示例"},{"id":"dependencies","name":"服务与依赖注入","english":"Cordis inject","color":"blue","question":"插件启动顺序和依赖变更，如何避免靠人工编排？","idea":"通过原生 plugin / inject 声明服务依赖，Cordis 根据绑定变化运行或回收功能块。产品 Manifest 分析与依赖环诊断另行设计。","structures":["plugin: { name, inject, apply }","ctx.inject(keys, setup)","Fiber.committed / 服务绑定"],"steps":["声明消费者依赖，通过 ctx.inject 或插件 inject 字段挂载。","依赖缺失时保持 PENDING；fiber.await() 结束不等于依赖已满足。","提供者可用后由 Cordis 激活消费者，绑定变化由框架协调。","进程健康、Manifest 冲突与已知依赖环由产品服务诊断。"],"invariant":"稳定 Tools 服务与具体工具贡献项分开。更新一项工具不应靠替换整个 Tools 服务完成。","trap":"把 await ctx.plugin() 当作业务 ready；把 npm 依赖当服务依赖；把 Manifest 环检测当 Cordis 自带保证。","decide":"怎样定义“就绪”：插件准备完成后由产品注册服务统一提交，还是额外设置显式 ready 握手？","decisionId":"D04","code":"const consumer = root.inject(['storage'], ctx => {\n  // 声明依赖后读取原生 Context 上的服务。\n  const subscription = ctx.storage.subscribe();\n  return () => subscription.cancel();\n});\nawait consumer.await();\n// 此时也可能仍为 PENDING，不能直接宣布应用 ready。","sources":["https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/registry.ts","https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/fiber.ts#L395"],"codeLabel":"Cordis 原生 API · 示例"},{"id":"lifecycle","name":"激活与状态协调","english":"Cordis Fiber lifecycle","color":"teal","question":"正在启动时又收到停止，旧结果还有没有权利生效？","idea":"进程内依赖刷新与 epoch 沿用 Cordis Fiber。产品的 enabled 意图、持久实例 ID、远程 activationId 和进程状态由宿主映射。","structures":["PENDING / LOADING / ACTIVE","FAILED / DISPOSED / UNLOADING","instanceId / activationId: host-owned"],"steps":["由宿主保存实例配置与 enabled 状态，再调用 ctx.plugin。","更新与刷新使用原生 update / restart；await 等待当前任务稳定。","停用时释放 Fiber；重新启用创建新的 Fiber，保留产品实例记录。","远程连接发放独立 activationId，过期消息不能修改当前注册。"],"invariant":"Fiber uid 不等于产品 activationId。已 disposed 的插件 Fiber 需要重新挂载，不能直接 start。","trap":"调用旧草案的 start / stop 或 ctx.signal，误认为它们已经是 Cordis API；依赖私有 epoch 作为长期插件协议。","decide":"连续 start / stop / restart，是逐个执行，还是收敛到最新意图？","decisionId":"D05","code":"// 原生句柄；宿主另存 enabled / instanceId。\nconst fiber = root.plugin(plugin, config);\nawait fiber.await();\nawait fiber.update(nextConfig);\nawait fiber.dispose();\n// 重新启用：重新挂载，得到新的 Fiber。\nconst nextFiber = root.plugin(plugin, nextConfig);","sources":["https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/fiber.ts#L426","https://developer.mozilla.org/en-US/docs/Web/API/AbortController"],"codeLabel":"Cordis 原生 API · 示例"},{"id":"effects","name":"受管资源与清理","english":"Owned effects","color":"amber","question":"插件退出后，为什么还有定时器或连接活着？","idea":"使用原生 effect 或 generator，在获得资源后登记 disposer。Cordis 外层清理可并行，复合 effect 内部逆序；消费者依赖决定提供者的释放时机。","structures":["ctx.effect(acquire)","generator → yield disposer","Fiber.getEffects() / 依赖释放"],"steps":["获取资源后及时 yield 或登记 disposer，覆盖部分初始化失败。","有严格先后关系的资源放在同一个复合 effect 中。","需要失败后仍全部清理的操作，使用独立 effect 或显式错误汇总并测试。","进程超时、强制终止与远程取消由 Runtime / Supervisor 承担。"],"invariant":"清理入口幂等不等于每次清理都成功；必须验证错误和迟到结果。不能承诺所有插件资源全局串行逆序释放。","trap":"以为独立 effect 总是串行清理，或以为任意复合 effect 内的一项失败都会自动继续后续清理。","decide":"直接使用 Cordis generator / effect，还是在产品 SDK 中增加便利的 onDispose 封装？","decisionId":"D06","code":"// Cordis 支持的 generator effect 形式。\nawait ctx.effect(async function* () {\n  const connection = await connect();\n  yield () => connection.close();\n  const subscription = await connection.subscribe();\n  yield () => subscription.cancel();\n});\n// 正常复合清理：subscription → connection。\n// 失败后是否继续所有清理需按产品要求补测试。","sources":["https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/fiber.ts","https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/tests/dispose.spec.ts"],"codeLabel":"Cordis 原生 effect · 资源函数为示意"},{"id":"registration","name":"注册批次与快照","english":"Product registry extension","color":"blue","question":"工具已经出现，面板却初始化失败，该留下什么？","idea":"这部分由产品注册服务实现。Cordis 负责插件与 effect 的寿命，Tools / Views 另行实现暂存、完整修订和原子发布；业务副作用不在注册事务里。","structures":["Batch { ownerActivation, stagedEntries }","RegistrySnapshot { revision, entries }","Lease { revision, targets, release }"],"steps":["准备期间收集服务、工具与 UI 的注册描述，普通读者看不到暂存项。","提交前重新检查归属、冲突、依赖和基准修订。","构造下一份完整快照，通过单一发布点切换可见修订。","提交完成后再发通知；通知失败不能把已提交版本假装回滚。"],"invariant":"读者只看到完整旧修订或完整新修订；旧 Step 的工具定义和执行目标来自同一份快照。","trap":"依次修改 tools Map、await 一次、再修改 views Map；中间读者会看到混合版本。","decide":"采用统一不可变快照，还是让每个注册表参加准备与提交协议？","decisionId":"D07","code":"// 设计示意：提交路径内不执行外部异步代码\nconst next = buildSnapshot(current, stagedBatch);\nvalidate(next, stagedBatch.owner);\nassertBaseRevision(stagedBatch.baseRevision, current.revision);\ncurrent = next; // 唯一发布点\nqueueNotification({ type: 'registry.changed', revision: next.revision });\n// 已固定旧快照的调用，继续持有旧 targets。","sources":[],"codeLabel":"产品注册服务伪代码 · 尚未实现"},{"id":"events","name":"事件与可观察性","english":"Cordis event contracts","color":"amber","question":"一个监听器报错，应该阻止其他人收到通知吗？","idea":"保留 Cordis 原生分发契约。emit 同步执行，parallel 等待全部监听并汇总后抛错；需要仅记录通知错误时，在外层封装单独的通知服务。","structures":["ctx.on(event, callback)","ctx.emit / parallel / serial","通知服务捕获 AggregateError"],"steps":["根据是否等待结果选择原生分发方式。","emit 不等待 Promise，同步抛错可能中断后续监听。","parallel 等待本批监听，失败时抛出 AggregateError；调用方必须处理。","通知服务可捕获异常并送诊断，但不悄悄改写 ctx.emit 的含义。"],"invariant":"进程内事件遵守本地 Cordis 代码。跨进程授权与业务返回值由 Broker 和服务协议承担。","trap":"把旧草案的“emit 并行等待且不抛错”套在原生 Cordis 上。","decide":"通知采用并行等待并汇总错误，还是串行等待？","decisionId":"D08","code":"// 应用层通知服务的示意封装；不修改 ctx.emit。\nasync function notify(ctx, event, payload) {\n  try {\n    await ctx.parallel(event, payload);\n  } catch (error) {\n    diagnostics.record(error);\n  }\n}","sources":["https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/events.ts"],"codeLabel":"基于 Cordis parallel 的产品封装示意"}],"interfaceRows":[["new Context()","根运行环境","独立于 Electron、模型 SDK 与数据库。"],["ctx.plugin({ name, inject, apply }, config)","可等待 Fiber","沿用原生插件形态；产品包身份在外层。"],["ctx.inject(keys, setup)","依赖功能块","缺少依赖时 PENDING；等待稳定不保证已就绪。"],["fiber.update / restart / dispose","原生生命周期操作","已释放 Fiber 不能复用；产品停用状态由宿主保存。"],["ctx.isolate(name, label)","派生 Context","按服务键隔离，不自动建立产品 Scope 树。"],["ctx.provide / ctx.effect","受管资源与释放入口","业务注册事务另由 Tools / Views 实现。"],["ctx.on / emit / parallel / serial","原生事件分发","同步、并行与串行的完成及错误契约不同。"]],"pluginExample":"// 原生 Cordis 插件外形；tools / views 为待实现产品服务。\nexport const githubPlugin = {\n  name: 'github-workbench',\n  inject: ['tools', 'views'],\n  apply(ctx, config) {\n    // 概念契约：业务批次绑定插件资源寿命。\n    ctx.effect(() => {\n      const batch = ctx.tools.beginBatch(config.activationId);\n      batch.stageTool({ name: 'github.listPullRequests' });\n      batch.stageView({ id: 'github.dashboard', mode: 'iframe' });\n      // stage / commit 是产品服务 API，不是 Cordis 自带。\n      return () => batch.dispose();\n    });\n  },\n};","rpcExample":"// 发送方提出调用；宿主从连接绑定读取调用者身份。\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": \"request-42\",\n  \"method\": \"service.call\",\n  \"params\": {\n    \"service\": \"github@1\",\n    \"operation\": \"listPullRequests\",\n    \"input\": { \"repository\": \"owner/repo\" }\n  }\n}\n\n// 取消是我们的扩展，仍需校验 request 所有权。\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"request.cancel\",\n  \"params\": { \"requestId\": \"request-42\" }\n}","rpcSteps":["连接握手并绑定 instance / activation / scope 身份。","校验协议版本、方法白名单以及输入结构。","由 Broker 检查调用权限和预算，固定目标代次。","执行服务；以 requestId 关联结果、取消和超时。","连接关闭时拒绝挂起调用、释放订阅并撤销远程注册。"],"processFacts":[["同进程插件","适合可信内置服务。可共享对象，但公开扩展服务应面向未来的异步契约。同步死循环无法靠 Promise 超时抢占。"],["Node 子进程","承载业务 Runtime，支持进程监控和强制终止。进程边界本身不限制文件、网络或凭证访问。"],["UI iframe","承载隔离界面。敏感操作交给受控 Bridge；校验来源、发送窗口、消息结构及绑定权限。"],["Cordis 本地分支","已复用无 Electron 的 core。可以修改源码并维护回归测试；进程、权限和产品注册事务在框架之上补充。"]],"upgradeStages":[{"name":"准备","code":"PREPARE","detail":"验证 Manifest、依赖和入口，建立候选激活。代码目录不可变，业务数据目录独立。"},{"name":"预热","code":"WARM","detail":"候选就绪，工具和视图仍暂存。候选只读共享状态，写任务尚未接管。"},{"name":"切换","code":"COMMIT","detail":"工具和 UI 共同切换注册修订。新 Step 和新请求使用新目标。"},{"name":"排空","code":"DRAIN","detail":"已经持有旧快照的 Step 可继续调用旧目标。等待引用释放或到达明确期限。"},{"name":"回收","code":"DISPOSE","detail":"撤销旧激活剩余入口，执行清理并终止旧进程。记录异常和未完成任务。"}],"dataRows":[["包代码与静态资源","Package Store","不可变版本目录","升级创建新目录，保留回退所需版本。"],["实例启用配置","宿主配置服务","版本、scope、config、enabled","重启重新挂载，不序列化 Context 或进程句柄。"],["工具与视图注册","注册服务","运行时快照 + revision","进程重启后重新登记，旧 activation 消息失效。"],["业务事实","插件 Storage","独立数据目录 / 数据库","首版要求格式兼容；代码回退不等于数据回滚。"],["会话与工具记录","Session Storage","请求、结果、目标版本","中断调用标记为中断，不静默当作成功或自动重放。"],["凭证","宿主凭证服务","受控引用","不下发到普通 UI 或任意插件；调用时经授权代理使用。"]],"decisions":[{"id":"D01","group":"内核边界","title":"业务注册表如何接入统一生命周期？","baseline":"Cordis effect 绑定清理归属，产品 Tools / Views 管理批次与修订。","why":"如果每个注册表各写一套清理逻辑，升级与失败撤销容易出现不同步。","options":[{"id":"owned","label":"统一受管注册基座","text":"在产品服务层复用 owner、staging、commit、dispose 的注册基座。","tradeoff":"需要先定义一个足够小的扩展接口。"},{"id":"participants","label":"各服务实现事务参与接口","text":"产品发布协调器负责调度，服务各自实现准备与提交。","tradeoff":"各服务实现责任更多，必须验证提交阶段不失败。"}],"recommended":"owned","test":"让 Tools 准备成功、Views 准备失败；任何读者都不应看到半成品。","revisit":"新注册表无法用共同基座表达自身语义时。"},{"id":"D02","group":"身份与实例","title":"同一作用域能否启用多个同包实例？","baseline":"包、实例、激活和进程分开建模。","why":"多个 GitHub 连接或不同配置可能需要同一包的多个实例，但服务与工具名称必须消除歧义。","options":[{"id":"explicit","label":"显式实例 ID，多实例可选","text":"默认一个实例，只有明确提供唯一 instanceId 时才创建额外实例。","tradeoff":"需要定义工具命名和选择规则；服务键冲突仍然拒绝。"},{"id":"singleton","label":"首版每 Scope 每包一个实例","text":"用 Workspace 区分不同配置。","tradeoff":"实现简单，但同一工作台组合多个连接受限。"}],"recommended":"explicit","test":"同包两实例能独立停止；一个实例不能撤销另一个的注册。","revisit":"出现多个账户或多仓库连接需求时。"},{"id":"D03","group":"作用域","title":"产品服务替换后，消费者何时切换？","baseline":"Cordis 按服务绑定协调依赖；Workspace 共享与覆盖规则由宿主明确实现。","why":"查找结果变化会影响既有连接、缓存和资源所有权。","options":[{"id":"reactivate","label":"重新激活受影响消费者","text":"使用 Cordis 原生依赖变化，结束旧运行后使用新绑定。","tradeoff":"行为一致，切换期间可能暂时不可用。"},{"id":"pinned","label":"当前激活继续固定旧绑定","text":"产品稳定代理持有旧目标，下一激活才切换；这是额外策略。","tradeoff":"不中断现有工作，但同时存在两种有效绑定。"}],"recommended":"reactivate","test":"在明确 realm 内撤销旧提供者、安装新提供者，检查消费者与清理顺序。","revisit":"需要长连接无中断切换时。"},{"id":"D04","group":"依赖与就绪","title":"什么时刻可以宣布插件已经就绪？","baseline":"Cordis await 仅等待当前任务稳定，应用 ready 还需宿主检查依赖与进程健康。","why":"过早可见会让消费者调用尚未监听的服务。","options":[{"id":"activation","label":"激活成功后统一提交","text":"Cordis 插件完成准备后，由产品注册服务统一提交。","tradeoff":"协议简单，作者必须遵守准备完成的约定。"},{"id":"handshake","label":"额外就绪与健康握手","text":"Runtime 再验证连接与健康状态，随后请求内核提交。","tradeoff":"适合子进程，但应避免两个互相等待的 ready 状态。"}],"recommended":"activation","test":"服务仍在建立连接时，依赖消费者保持 waiting。","revisit":"接入真实 Node 进程时，在内核提交前增加宿主健康验证。"},{"id":"D05","group":"异步生命周期","title":"连续启停请求怎样协调？","baseline":"宿主协调用户 enabled 意图，进程内 Fiber 生命周期沿用 Cordis。","why":"逐个等待慢激活会拖延用户停止；任意抢占又可能遗留副作用。","options":[{"id":"converge","label":"收敛到最新意图","text":"更新目标状态，过期代次取消与清理。","tradeoff":"句柄需明确“被取代”的结果，不能把它报告成成功。"},{"id":"ordered","label":"严格逐个执行命令","text":"每个命令按顺序完成，结果直观。","tradeoff":"慢启动可能延迟停止，仍需专门取消通道。"}],"recommended":"converge","test":"插件仍在初始化时连续启用 → 停用 → 启用；只有最终有效实例可以发布业务注册。","revisit":"需要精确重放操作序列的管理工具出现时。"},{"id":"D06","group":"资源管理","title":"部分初始化如何即时登记清理？","baseline":"沿用 Cordis effect；明确复合逆序、外层并行与失败处理。","why":"在 apply 末尾才返回 disposer，无法覆盖中途抛错的获取过程。","options":[{"id":"onDispose","label":"显式 onDispose / resource API","text":"产品 SDK 在原生 effect 上提供便利登记；需要维护新增接口。","tradeoff":"简单易审查，需要约束作者不要遗漏登记。"},{"id":"generator","label":"generator / yield 获取协议","text":"直接使用 Cordis effect / generator，每次获取后 yield 清理。","tradeoff":"表达集中，但 API 学习和异步边界更复杂。"}],"recommended":"generator","test":"获取 A 成功、获取 B 失败，A 必须被清理一次。","revisit":"插件资源获取模式高度重复，显式登记容易遗漏时。"},{"id":"D07","group":"注册一致性","title":"怎样实现工具与 UI 的一次发布？","baseline":"暂存项不可见，提交发布完整修订。","why":"多个 Map 的独立更新会产生工具已出现、界面仍旧的混合版本。","options":[{"id":"snapshot","label":"统一不可变注册快照","text":"构造下一修订，通过单一引用切换发布。","tradeoff":"容易推理，需衡量快照构建与保留旧版本的成本。"},{"id":"coordinator","label":"各注册表准备后统一提交","text":"注册表维护各自结构，共用提交协调器。","tradeoff":"提交协议更复杂，必须禁止中途 await 和部分失败。"}],"recommended":"snapshot","test":"在高频读取中提交新版本，每次读到的工具与 UI 修订必须一致。","revisit":"注册量大到快照复制成为实际瓶颈时，以测量证据调整。"},{"id":"D08","group":"事件","title":"通知监听器如何执行与报告错误？","baseline":"原生 emit / parallel 保持上游语义，产品通知服务另行处理错误。","why":"分发顺序决定延迟和异常影响，不能由实现偶然决定。","options":[{"id":"parallel","label":"并行等待并汇总诊断","text":"通知服务调用 ctx.parallel，捕获 AggregateError 并记录诊断。","tradeoff":"无完成顺序保证，慢监听仍需独立超时策略。"},{"id":"serial","label":"逐个等待并收集错误","text":"启动顺序稳定，错误不中断后续监听。","tradeoff":"一个慢监听会延迟整个通知链。"}],"recommended":"parallel","test":"一个监听抛错、一个成功，成功监听必须执行且错误可定位。","revisit":"某类事件确实需要有序语义时，定义独立类型而非隐含依赖。"},{"id":"D09","group":"RPC","title":"跨进程暴露显式方法还是任意对象？","baseline":"远程方法异步、输入输出可序列化，身份绑定连接。","why":"Context 的对象属性和本地函数无法直接形成安全稳定的远程契约。","options":[{"id":"explicit","label":"显式方法描述与 Schema","text":"限定服务和操作名，校验输入、输出与权限。","tradeoff":"需要维护协议声明，但升级和审查清晰。"},{"id":"proxy","label":"生成受约束的代理层","text":"从显式契约生成调用代理，保留类型便利。","tradeoff":"需增加生成过程；运行时仍不得访问未声明属性。"}],"recommended":"explicit","test":"伪造调用者字段不能改变宿主绑定身份，未暴露方法必须被拒绝。","revisit":"协议稳定且样板代码明显增加时，再从契约生成代理。"},{"id":"D10","group":"升级","title":"旧版本调用何时必须结束？","baseline":"Step 固定旧工具定义与目标，切换后新 Step 使用新修订。","why":"无限等待会让旧进程长期存活；立即销毁会破坏执行中的调用。","options":[{"id":"bounded","label":"租约 + 有界排空","text":"等待旧引用释放，到期取消并返回明确错误。","tradeoff":"需要按任务预算制定期限，不能承诺所有旧任务都完成。"},{"id":"manual","label":"持续保留，用户手动结束","text":"适合少量超长任务，界面展示旧版本占用。","tradeoff":"资源和数据写入交接更难管理。"}],"recommended":"bounded","test":"在旧 Step 尚未调用完工具时升级，目标保持旧版本；超时后租约被清理。","revisit":"出现需要跨数小时运行的任务时，增加任务迁移或版本保留策略。"},{"id":"D11","group":"恢复","title":"重启后怎样处理未完成的工具调用？","baseline":"保存配置和事实，运行对象重新创建，副作用不能无条件重放。","why":"客户端崩溃时，远端操作可能已成功但结果尚未写回。","options":[{"id":"interrupted","label":"标记中断，等待明确恢复","text":"先恢复环境，再显示未确定的操作状态。","tradeoff":"用户可能需要介入，但不重复执行未知副作用。"},{"id":"idempotent","label":"仅自动恢复已声明幂等操作","text":"要求幂等键或可查询的执行结果。","tradeoff":"必须由具体服务提供证据，不能仅靠工具名称判断。"}],"recommended":"interrupted","test":"模拟远端已成功、本地结果未落盘的崩溃窗口，重启不自动重复写入。","revisit":"具体工具支持幂等键与状态查询时逐项开放恢复。"},{"id":"D12","group":"诊断","title":"怎样解释插件为何没有启动或没有释放？","baseline":"暴露状态、缺失依赖、失败与清理错误。","why":"只有日志文本会让配置问题、依赖等待与运行崩溃混在一起。","options":[{"id":"snapshot-events","label":"诊断快照 + 有界事件记录","text":"当前状态与最近变化一起提供，关联实例与激活代次。","tradeoff":"需脱敏和容量限制，避免日志无限增长。"},{"id":"events","label":"仅结构化事件日志","text":"先降低实现规模，由调用方重建状态。","tradeoff":"重建成本高，截断日志后可能缺少解释。"}],"recommended":"snapshot-events","test":"能回答“在等谁”“谁还占用旧版本”“哪项清理失败”。","revisit":"遥测规模和跨设备查询有真实需求时。"}],"roadmap":[{"id":"phase-1","title":"复用与验证 Cordis","label":"源码已引入","deliver":"原样引入 core 与测试，构建真实 cordis 包，运行依赖与清理样例。","checks":["scope-lookup","scope-isolation","effect-once","effect-late"]},{"id":"phase-2","title":"Workspace 与实例映射","label":"补齐产品语义","deliver":"产品身份、服务隔离范围、启用配置、原生状态映射与 Manifest 诊断。","checks":["deps-order","deps-recover","deps-cycle","lifecycle-race"]},{"id":"phase-3","title":"注册与协议","label":"形成稳定边界","deliver":"注册批次、快照、错误协议、同进程与内存传输适配器。","checks":["batch-atomic","snapshot-target","rpc-identity","rpc-disconnect"]},{"id":"phase-4","title":"真实桌面闭环","label":"接入产品环境","deliver":"Electron、Node 进程、真实模型、GitHub 工具与工作台、持久化。","checks":["process-lifecycle","real-tools","ui-revision","restart-state"]}],"checks":[{"id":"scope-lookup","text":"显式服务 realm 的可见性符合 Workspace 共享策略。"},{"id":"scope-isolation","text":"两个 Workspace 的实例不能跨域撤销或覆盖注册。"},{"id":"effect-once","text":"复合 effect 正常逆序释放；独立资源的错误处理符合约定。"},{"id":"effect-late","text":"取消后才获取成功的资源立即释放。"},{"id":"deps-order","text":"插件乱序挂载仍按依赖激活。"},{"id":"deps-recover","text":"提供者下线，消费者先收尾；恢复后重新激活。"},{"id":"deps-cycle","text":"Manifest 层区分缺失依赖与已知环，不假定 Cordis 自带分析。"},{"id":"lifecycle-race","text":"连续启停后，过期代次无法发布或覆盖新状态。"},{"id":"batch-atomic","text":"部分准备失败不暴露半成品，提交呈现完整修订。"},{"id":"snapshot-target","text":"旧 Step 的工具定义与执行目标始终匹配。"},{"id":"rpc-identity","text":"伪造身份字段和未授权方法被拒绝。"},{"id":"rpc-disconnect","text":"RPC 断线会拒绝挂起请求并释放订阅。"},{"id":"process-lifecycle","text":"插件真实进程启动、停止和异常退出被宿主管理。"},{"id":"real-tools","text":"真实模型能够发现并调用 GitHub 插件工具。"},{"id":"ui-revision","text":"注册升级后工具与 UI 使用一致修订；缺序可恢复快照。"},{"id":"restart-state","text":"重启恢复配置与数据；未完成副作用不会无条件重放。"}],"sources":[{"title":"Context 与隔离","file":"context.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/context.ts","purpose":"看上下文派生与服务隔离，别直接把它等同于产品的用户权限。","topic":"scope","chapter":"mechanisms"},{"title":"插件挂载与注入","file":"registry.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/registry.ts","purpose":"看定义、运行实例与 inject 如何关联。","topic":"dependencies","chapter":"mechanisms"},{"title":"激活、代次与资源","file":"fiber.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/fiber.ts","purpose":"重点看 _refresh、_setEpoch、_reload、_unload 与 effect。","topic":"lifecycle","chapter":"mechanisms"},{"title":"服务变化与释放","file":"reflect.ts / service.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/reflect.ts","purpose":"看服务绑定如何通知消费者，以及提供者为何等待消费者收尾。","topic":"dependencies","chapter":"mechanisms"},{"title":"事件分发","file":"events.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/src/events.ts","purpose":"逐个比较 emit、parallel、serial、bail 和 waterfall 的契约。","topic":"events","chapter":"mechanisms"},{"title":"资源与依赖清理测试","file":"dispose.spec.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/tests/dispose.spec.ts","purpose":"直接运行已有测试，修改本地内核时补充对应回归用例。","topic":"effects","chapter":"mechanisms"},{"title":"服务释放测试","file":"service-dispose.spec.ts","url":"https://github.com/cordiverse/cordis/blob/35fdc969e4b6c48c48ed44717c7a018324e4dd88/packages/core/tests/service-dispose.spec.ts","purpose":"对照消费者与提供者的释放顺序。","topic":"effects","chapter":"mechanisms"},{"title":"JSON-RPC 2.0","file":"协议规范","url":"https://www.jsonrpc.org/specification","purpose":"请求、响应、错误与通知；取消和订阅关闭需自行扩展。","chapter":"interfaces"},{"title":"Electron 安全边界","file":"官方安全文档","url":"https://www.electronjs.org/docs/latest/tutorial/security","purpose":"Renderer 的权限、上下文隔离、IPC 发送者验证与内容边界。","chapter":"interfaces"},{"title":"取消信号","file":"AbortController","url":"https://developer.mozilla.org/en-US/docs/Web/API/AbortController","purpose":"取消是协作机制；不要把超时等同于底层任务已经终止。","chapter":"mechanisms","topic":"lifecycle"},{"title":"iframe 消息桥","file":"window.postMessage","url":"https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage","purpose":"校验来源与发送窗口，使用明确的目标来源。","chapter":"interfaces"}],"glossary":[["Context","Cordis 插件入口；产品身份通过宿主映射，不整体跨进程传输。"],["Service","具有稳定标识和契约的可依赖能力。"],["Contribution","工具、视图等业务注册项，归某次激活所有。"],["Scope","产品的能力可见范围，需要明确映射到 Cordis 的服务 realm 或独立 Context。"],["Instance","某个作用域中启用的插件配置实例。"],["Activation / generation","一次启动产生的运行代次，用于判断异步结果是否仍有效。"],["Effect / disposer","已登记资源及其释放操作。"],["Injection block","根据独立依赖启停、归父插件所有的功能块。"],["Staging","准备资源与注册，但尚未对普通读者发布。"],["Revision","一份完整可见注册快照的版本。"],["Lease","对旧快照或旧执行目标的保留引用，需要显式释放。"],["Drain","停止分配新的工作，等待已有引用和调用结束。"],["Broker","绑定身份、校验权限并路由受控调用的入口。"],["Supervisor","负责真实进程启动、监控、停止和强制终止的宿主组件。"],["Desired / observed state","用户希望实例处于的状态，与实例当前实际运行状态。"],["ADR","架构决策记录：背景、选择、理由、代价和验证证据。"]]},"scenarios":[{"id":"dependency","title":"依赖上线与下线","subtitle":"B 依赖 A，先挂载 B。","decision":"D04","lesson":"服务的逻辑可用性与物理资源寿命不同。退出时可以先关闭新入口，再为消费者收尾保留依赖。","branches":[{"id":"normal","label":"完整生命周期","steps":[{"title":"消费者先到达","explanation":"B 已启用，但 storage@1 尚未出现。它等待，不进入失败。","nodes":[{"name":"A · Storage","state":"absent","generation":"—","note":""},{"name":"B · GitHub","state":"waiting","generation":"—","note":"缺少 storage@1"}],"revision":"r0","visible":[],"staged":[],"resources":[],"invariant":"未满足依赖时不能执行 B.apply。","log":"mount B → waiting: storage@1"},{"title":"提供者正在准备","explanation":"A 获取连接并暂存服务。B 仍然看不到可调用的 storage@1。","nodes":[{"name":"A · Storage","state":"activating","generation":"A1","note":""},{"name":"B · GitHub","state":"waiting","generation":"—","note":""}],"revision":"r0","visible":[],"staged":["storage@1 / owner A1"],"resources":["A1 数据连接（准备中）"],"invariant":"声明服务与服务就绪是两个时刻。","log":"A1.prepare → service staged"},{"title":"A 提交，唤醒 B","explanation":"A 成功提交服务。协调器为 B 分配 B1，并把它绑定到 A1。","nodes":[{"name":"A · Storage","state":"active","generation":"A1","note":""},{"name":"B · GitHub","state":"activating","generation":"B1","note":"依赖绑定 A1"}],"revision":"r1","visible":["storage@1 → A1"],"staged":[],"resources":["A1 数据连接","B1 临时初始化资源"],"invariant":"B1 的依赖目标明确，不能在执行中静默换成 A2。","log":"commit A1 → evaluate B → activate B1"},{"title":"双方运行","explanation":"B 发布工具和视图。注册项归 B1，Storage 连接归 A1。","nodes":[{"name":"A · Storage","state":"active","generation":"A1","note":""},{"name":"B · GitHub","state":"active","generation":"B1","note":""}],"revision":"r2","visible":["storage@1 → A1","github.search → B1","github.dashboard → B1"],"staged":[],"resources":["A1 数据连接","B1 定时任务与订阅"],"invariant":"服务可见性与资源所有权分别建模。","log":"commit B1 → registry revision r2"},{"title":"用户停止 A","explanation":"停止分配新工作，B 开始收尾。A 的资源仍保留，供 B 完成必要清理。","nodes":[{"name":"A · Storage","state":"deactivating","generation":"A1","note":"等待消费者"},{"name":"B · GitHub","state":"deactivating","generation":"B1","note":"清理中"}],"revision":"r3","visible":[],"staged":[],"resources":["A1 数据连接（仅保留清理访问）","B1 待释放订阅"],"invariant":"撤销外部入口不等于立刻销毁提供者。","log":"retire A1/B1 bindings → dispose consumers first"},{"title":"B 完成收尾","explanation":"B 清理结束，释放对 A1 的依赖。由于 B 仍启用，它返回等待状态。","nodes":[{"name":"A · Storage","state":"deactivating","generation":"A1","note":""},{"name":"B · GitHub","state":"waiting","generation":"—","note":"仍启用，等待服务"}],"revision":"r3","visible":[],"staged":[],"resources":["A1 数据连接"],"invariant":"消费者完成清理后，提供者才能释放资源。","log":"B1.dispose done → release A1 dependency"},{"title":"A 已停止","explanation":"A 保持用户要求的停用状态；B 等待未来的提供者。","nodes":[{"name":"A · Storage","state":"stopped","generation":"—","note":""},{"name":"B · GitHub","state":"waiting","generation":"—","note":""}],"revision":"r3","visible":[],"staged":[],"resources":[],"invariant":"显式停止不能因依赖变化自行恢复。","log":"A1.dispose done → A stopped"},{"title":"重新启用后恢复","explanation":"用户重新启用 A。A2 和 B2 分别完成准备与提交，旧代次不复用。","nodes":[{"name":"A · Storage","state":"active","generation":"A2","note":""},{"name":"B · GitHub","state":"active","generation":"B2","note":""}],"revision":"r5","visible":["storage@1 → A2","github.search → B2","github.dashboard → B2"],"staged":[],"resources":["A2 数据连接","B2 定时任务与订阅"],"invariant":"保留实例配置，重新创建运行资源。","log":"start A → commit A2 → commit B2"}]}]},{"id":"cancellation","title":"启动中取消与迟到结果","subtitle":"连接还没建立，用户已经停止插件。","decision":"D05","lesson":"取消只能表达意图；底层操作可能仍然完成。代次校验和迟到资源清理必须同时存在。","branches":[{"id":"normal","label":"底层连接忽略取消","steps":[{"title":"开始异步获取","explanation":"A1 发起连接请求，尚未获得连接对象。","nodes":[{"name":"插件实例","state":"activating","generation":"A1","note":""},{"name":"异步连接","state":"pending","generation":"A1","note":""}],"revision":"r0","visible":[],"staged":[],"resources":["pending connect()"],"invariant":"在 await 之前就建立激活代次与取消信号。","log":"begin A1 → await connect()"},{"title":"用户发出停止","explanation":"目标状态改为 disabled，A1 失效，信号被取消。连接请求还可能在底层运行。","nodes":[{"name":"插件实例","state":"deactivating","generation":"A1","note":"已失效"},{"name":"异步连接","state":"pending","generation":"A1","note":"不保证立即结束"}],"revision":"r0","visible":[],"staged":[],"resources":["pending connect()（取消已请求）"],"invariant":"超时或 abort 不代表底层任务已停止。","log":"stop → invalidate A1 → abort signal"},{"title":"迟到的连接成功","explanation":"connect() 返回连接，但协调器发现 A1 已不是有效激活。","nodes":[{"name":"插件实例","state":"deactivating","generation":"A1","note":""},{"name":"异步连接","state":"stale","generation":"A1","note":"禁止发布"}],"revision":"r0","visible":[],"staged":[],"resources":["迟到连接 → 立即 close()"],"invariant":"过期结果只能清理，不能 provide 或更新新状态。","log":"connect resolved → stale generation → close()"},{"title":"停止完成","explanation":"迟到资源已经释放，没有服务、监听或连接残留。","nodes":[{"name":"插件实例","state":"stopped","generation":"—","note":""},{"name":"异步连接","state":"disposed","generation":"A1","note":""}],"revision":"r0","visible":[],"staged":[],"resources":[],"invariant":"stop 的完成语义必须明确是否等待受管清理。","log":"A1 cleanup complete → stopped"},{"title":"新一代独立运行","explanation":"再次启动使用 A2；来自 A1 的消息被拒绝，而不是写入 A2 的资源容器。","nodes":[{"name":"插件实例","state":"active","generation":"A2","note":""},{"name":"旧回调","state":"stale","generation":"A1","note":""}],"revision":"r1","visible":["service@1 → A2"],"staged":[],"resources":["A2 独立连接"],"invariant":"旧结果不能借用新 activationId。","log":"commit A2; reject late callback from A1"}]}]},{"id":"transaction","title":"多项注册的原子发布","subtitle":"工具准备好了，UI 却可能准备失败。","decision":"D07","lesson":"注册事务保证可见性一致，不能自动撤销已经发生的外部数据库写入或网络操作。","branches":[{"id":"failure","label":"UI 准备失败","steps":[{"title":"已有稳定版本","explanation":"系统已有 r4；候选插件 C1 尚未发布任何能力。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"activating","generation":"C1","note":""}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":[],"resources":["C1 临时资源"],"invariant":"准备失败不能破坏现有修订。","log":"begin batch C1 against r4"},{"title":"工具登记到暂存区","explanation":"github.search 已准备，但普通 Agent 查询仍只读到 r4。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"activating","generation":"C1","note":""}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":["github.search → C1"],"resources":["C1 临时资源"],"invariant":"staged 不等于 published。","log":"stage tool github.search"},{"title":"UI 准备抛错","explanation":"候选激活失败。批次整体撤销，工具从未被普通读者看见。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"deactivating","generation":"C1","note":"UI 初始化失败"}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":[],"resources":["C1 临时资源（清理中）"],"invariant":"不能留下“可调用工具 + 缺失面板”的半成品。","log":"view preparation failed → rollback C1 batch"},{"title":"失败已清理","explanation":"C1 进入 failed，报告原因；当前注册仍是 r4。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"failed","generation":"C1","note":""}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":[],"resources":[],"invariant":"失败结果可诊断，且没有受管资源残留。","log":"cleanup C1 complete; current revision remains r4"}]},{"id":"success","label":"全部准备成功","steps":[{"title":"开始准备批次","explanation":"当前读者继续使用 r4。候选准备服务、工具和界面。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"activating","generation":"C1","note":""}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":[],"resources":["C1 临时资源"],"invariant":"准备期间没有对普通读者的可见变化。","log":"begin C1 batch"},{"title":"注册准备完整","explanation":"工具与视图均在暂存区，尚未发布。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"activating","generation":"C1","note":""}],"revision":"r4","visible":["已有工具与界面 / r4"],"staged":["github.search → C1","github.dashboard → C1"],"resources":["C1 就绪资源"],"invariant":"提交前校验冲突、代次与基准修订。","log":"validate batch → ready to commit"},{"title":"一次切换修订","explanation":"单一发布点把完整 r5 设为当前快照，随后发送变化通知。","nodes":[{"name":"当前环境","state":"active","generation":"stable","note":""},{"name":"候选插件","state":"active","generation":"C1","note":""}],"revision":"r5","visible":["已有工具与界面","github.search → C1","github.dashboard → C1"],"staged":[],"resources":["C1 活跃资源"],"invariant":"任何一次快照读取只能得到完整 r4 或完整 r5。","log":"commit r5 → enqueue registry.changed"}]}]},{"id":"cleanup","title":"消费者先于提供者释放","subtitle":"B 的清理过程还需要调用 A。","decision":"D06","lesson":"依赖决定消费者与提供者的释放顺序。Cordis 外层 disposer 可并行，复合 effect 内逆序；必须全部完成的清理要明确错误处理。","branches":[{"id":"normal","label":"有依赖的清理","steps":[{"title":"建立依赖关系","explanation":"B 使用 A 的 Storage，并登记了订阅与任务。","nodes":[{"name":"A · Storage","state":"active","generation":"A1","note":""},{"name":"B · Runtime","state":"active","generation":"B1","note":""}],"revision":"r2","visible":["storage@1 → A1","工具 → B1"],"staged":[],"resources":["A1 连接","B1 订阅","B1 任务"],"invariant":"内核记录 B1 → A1 的反向依赖。","log":"dependents(A1) = { B1 }"},{"title":"开始停用","explanation":"新的外部调用被拒绝，B 运行任务接到取消；A 还不能关闭连接。","nodes":[{"name":"A · Storage","state":"deactivating","generation":"A1","note":"保留清理访问"},{"name":"B · Runtime","state":"deactivating","generation":"B1","note":""}],"revision":"r3","visible":[],"staged":[],"resources":["A1 连接（持有）","B1 订阅","B1 任务（取消中）"],"invariant":"运行取消信号与清理调用的期限不能简单共用同一个已取消信号。","log":"retire public routes → request B1 cleanup"},{"title":"清理消费者资源","explanation":"B 先取消订阅，再完成依赖于 A 的必要收尾。产品对必须继续的清理应显式汇总错误，不假定原生复合 effect 自动继续。","nodes":[{"name":"A · Storage","state":"deactivating","generation":"A1","note":""},{"name":"B · Runtime","state":"deactivating","generation":"B1","note":"最后一次清理调用"}],"revision":"r3","visible":[],"staged":[],"resources":["A1 连接（持有）","B1 收尾调用"],"invariant":"提供者有效到消费者释放依赖为止。","log":"dispose B1 effects → release dependency"},{"title":"消费者已经释放","explanation":"B1 资源清理完成，A1 的消费者集合为空。","nodes":[{"name":"A · Storage","state":"deactivating","generation":"A1","note":""},{"name":"B · Runtime","state":"disposed","generation":"B1","note":""}],"revision":"r3","visible":[],"staged":[],"resources":["A1 连接"],"invariant":"此时 A 才可以释放底层服务资源。","log":"dependents(A1) = {}"},{"title":"提供者最后关闭","explanation":"A 的连接关闭。实例可最终释放，或根据目标状态等待下一次启动。","nodes":[{"name":"A · Storage","state":"disposed","generation":"A1","note":""},{"name":"B · Runtime","state":"disposed","generation":"B1","note":""}],"revision":"r3","visible":[],"staged":[],"resources":[],"invariant":"成功清理后，受管资源计数回到零。","log":"close A1 connection → teardown complete"}]}]},{"id":"upgrade","title":"热升级与旧调用快照","subtitle":"Step S1 正在使用 v1，此时发布 v2。","decision":"D10","lesson":"固定工具定义还不够，执行目标也必须固定。旧 Step 的租约可能在切换后才真正发起某个工具调用。","branches":[{"id":"success","label":"候选就绪并切换","steps":[{"title":"旧 Step 已获取快照","explanation":"S1 在 r7 获取工具定义，并保留指向 v1 / A1 的目标租约。","nodes":[{"name":"旧版本 v1","state":"active","generation":"A1","note":""},{"name":"新版本 v2","state":"absent","generation":"—","note":""},{"name":"Step S1","state":"running","generation":"r7","note":""}],"revision":"r7","visible":["tool → v1 / A1","view → v1 / A1"],"staged":[],"resources":["A1 资源","S1 旧快照租约"],"invariant":"租约覆盖整个 Step 所需的定义与目标。","log":"S1.acquire(r7, targets A1)"},{"title":"候选预热","explanation":"A2 只读共享状态，准备新的工具与视图。v1 仍是当前版本。","nodes":[{"name":"旧版本 v1","state":"active","generation":"A1","note":""},{"name":"新版本 v2","state":"activating","generation":"A2","note":""},{"name":"Step S1","state":"running","generation":"r7","note":""}],"revision":"r7","visible":["tool → v1 / A1","view → v1 / A1"],"staged":["tool → v2 / A2","view → v2 / A2"],"resources":["A1 资源","A2 候选资源","S1 旧快照租约"],"invariant":"候选写任务尚未接管，准备失败不会改变当前路由。","log":"warm A2 → stage contributions"},{"title":"一次发布 r8","explanation":"新 Step 使用 v2。S1 仍可使用自己已经获得的旧快照；旧 UI 入口按版本策略失效。","nodes":[{"name":"旧版本 v1","state":"draining","generation":"A1","note":""},{"name":"新版本 v2","state":"active","generation":"A2","note":""},{"name":"Step S1","state":"running","generation":"r7","note":""}],"revision":"r8","visible":["新调用 → v2 / A2","新界面 → v2 / A2"],"staged":[],"resources":["A1 被 S1 保留","A2 活跃资源"],"invariant":"切换阻止新的旧版本租约，但不偷偷重定向已固定的调用。","log":"commit r8 → stop issuing new A1 leases"},{"title":"S1 调用旧工具","explanation":"即使调用发生在切换之后，只要 S1 的租约仍有效，它也调用 A1，而不是把旧参数结构送给 A2。","nodes":[{"name":"旧版本 v1","state":"draining","generation":"A1","note":""},{"name":"新版本 v2","state":"active","generation":"A2","note":""},{"name":"Step S1","state":"running","generation":"r7 → A1","note":""}],"revision":"r8","visible":["新调用 → v2 / A2","新界面 → v2 / A2"],"staged":[],"resources":["S1 → A1 工具执行","A2 活跃资源"],"invariant":"工具 Schema 与处理器代次必须匹配。","log":"execute S1.tool using A1 target"},{"title":"旧租约释放","explanation":"S1 完成。A1 没有剩余调用，可以清理。共享数据写入权交接仍由业务协议约束。","nodes":[{"name":"旧版本 v1","state":"deactivating","generation":"A1","note":""},{"name":"新版本 v2","state":"active","generation":"A2","note":""},{"name":"Step S1","state":"completed","generation":"r7","note":""}],"revision":"r8","visible":["tool → v2 / A2","view → v2 / A2"],"staged":[],"resources":["A1 清理中","A2 活跃资源"],"invariant":"路由切换不能代替业务写入冲突控制。","log":"S1.release() → leaseCount(A1) = 0"},{"title":"升级完成","explanation":"A1 退出，只剩 A2。若旧调用超过期限，需走取消与明确失败路径，不能报告无损完成。","nodes":[{"name":"旧版本 v1","state":"disposed","generation":"A1","note":""},{"name":"新版本 v2","state":"active","generation":"A2","note":""},{"name":"Step S1","state":"completed","generation":"r7","note":""}],"revision":"r8","visible":["tool → v2 / A2","view → v2 / A2"],"staged":[],"resources":["A2 活跃资源"],"invariant":"回收旧运行资源，保留所需代码和业务数据记录。","log":"dispose A1 → terminate old runtime"}]},{"id":"failure","label":"候选准备失败","steps":[{"title":"v1 继续服务","explanation":"当前修订 r7，新版本还没有生效。","nodes":[{"name":"旧版本 v1","state":"active","generation":"A1","note":""},{"name":"新版本 v2","state":"activating","generation":"A2","note":""}],"revision":"r7","visible":["tool → v1 / A1","view → v1 / A1"],"staged":[],"resources":["A1 活跃资源","A2 候选资源"],"invariant":"当前路由在准备阶段保持不变。","log":"begin A2 preparation"},{"title":"健康检查失败","explanation":"A2 无法就绪，撤销候选注册并清理候选资源。","nodes":[{"name":"旧版本 v1","state":"active","generation":"A1","note":""},{"name":"新版本 v2","state":"deactivating","generation":"A2","note":""}],"revision":"r7","visible":["tool → v1 / A1","view → v1 / A1"],"staged":[],"resources":["A1 活跃资源","A2 清理中"],"invariant":"失败发生在提交之前，因此无需把当前路由切回去。","log":"health check failed → discard candidate A2"},{"title":"继续使用旧版本","explanation":"A2 进入失败状态供诊断，A1 继续工作。提交后的故障恢复是另一个需要设计的场景。","nodes":[{"name":"旧版本 v1","state":"active","generation":"A1","note":""},{"name":"新版本 v2","state":"failed","generation":"A2","note":""}],"revision":"r7","visible":["tool → v1 / A1","view → v1 / A1"],"staged":[],"resources":["A1 活跃资源"],"invariant":"准备失败保留旧版本，不等于承诺任何阶段都能回滚数据。","log":"A2 cleaned; current revision remains r7"}]}]}],"questions":[{"q":"微内核和 Agent Loop 有什么区别？","a":"内核管理能力如何组合、启停和清理。Agent Loop 负责请求模型、选择工具、推进 Step。把 Loop 作为服务挂载，能保留替换实现的边界。","tags":["职责","Agent"],"target":"boundaries"},{"q":"为什么不直接维护一个插件数组？","a":"数组可以记录加载项，但不能单独表达依赖就绪、服务隔离、资源归属和依赖变化后的清理顺序。项目直接使用 Cordis 已有机制，在其上补充产品服务。","tags":["依赖","内核"],"target":"mechanisms","topic":"dependencies"},{"q":"一个插件包一定对应一个进程吗？","a":"不一定。包是代码单元，实例关联配置，激活拥有运行资源，进程由 Runtime 分配。可信内置实例可以同进程，业务 Runtime 可以独立进程。","tags":["身份","进程"],"target":"boundaries"},{"q":"Context 是全局服务容器吗？","a":"Context 是访问服务与注册资源的入口。派生 Context 可共享服务，isolate 按指定服务键选择 realm，并非通用的父级回退树。Workspace 的服务映射和权限仍由产品宿主明确管理。","tags":["Context","Scope"],"target":"mechanisms","topic":"scope"},{"q":"为什么插件有自己的资源容器，还要共享 Scope？","a":"资源归属决定谁退出时清理什么；服务 realm 决定插件能发现哪个服务实例。Cordis 用 Fiber 生命周期与按服务键隔离分别处理两者，产品 Scope 再把 Workspace 映射到这些机制。","tags":["资源","Scope"],"target":"mechanisms","topic":"scope"},{"q":"缺少依赖应该报错还是等待？","a":"当前基线是等待并显示缺失项。已知声明图中的依赖环是配置错误；尚未安装的提供者不是环。显式停用和等待依赖也必须分开。","tags":["依赖","waiting"],"target":"mechanisms","topic":"dependencies"},{"q":"服务提供者替换后，消费者怎么办？","a":"基础服务按选定契约使受影响消费者重新激活。业务工具是稳定 Tools 服务内的注册项，其升级不应迫使整个 Agent 服务重启。","tags":["服务","升级"],"target":"decisions","decision":"D03"},{"q":"为什么工具注册和服务注册要分开？","a":"Agent 依赖稳定的工具注册服务，具体 GitHub 工具只是其中的贡献项。分开之后，工具目录可以变化，而 Agent 的基础依赖不必随每项工具变化而重建。","tags":["Tools","注册"],"target":"boundaries"},{"q":"apply 返回就代表业务服务可用了吗？","a":"Cordis 对象插件使用 apply，类服务可用 Service.init。await Fiber 只等待当前任务稳定，也可能仍为 PENDING；应用 ready 由宿主结合依赖、进程健康和业务准备明确判定。","tags":["apply","就绪"],"target":"decisions","decision":"D04"},{"q":"把全部操作放进一个队列就安全了吗？","a":"沿用 Cordis 进程内协调。产品宿主可以串行提交启停意图，但不要在全局锁里等待插件代码与其依赖。远程结果还需检查宿主 activationId。","tags":["并发","队列"],"target":"mechanisms","topic":"lifecycle"},{"q":"AbortController 能强制停止插件吗？","a":"不能。取消信号需要被调用方协作处理，Promise 超时也不会抢占同步死循环。旧代次仍需禁止发布；真实进程的强制终止交给 Supervisor。","tags":["取消","AbortSignal"],"target":"scenarios","scenario":"cancellation"},{"q":"插件已经停止，异步连接却刚刚成功怎么办？","a":"检查资源所属的 activation 是否仍有效。若已失效，立即清理连接，不允许注册服务。这个失败路径和正常返回 disposer 同样重要。","tags":["迟到","资源"],"target":"scenarios","scenario":"cancellation"},{"q":"清理时为什么先停消费者？","a":"消费者的收尾可能依赖提供者，例如取消持久化订阅。先撤销新入口，再保留必要的清理访问；消费者释放依赖后，提供者才关闭底层资源。","tags":["清理","依赖"],"target":"scenarios","scenario":"cleanup"},{"q":"最后返回一个 dispose 函数够不够？","a":"若 apply 中途失败，最后的 disposer 不会返回。使用 Cordis effect / generator，获得资源后及时 yield 清理；onDispose 如需提供，属于产品 SDK 扩展。","tags":["dispose","effect"],"target":"decisions","decision":"D06"},{"q":"工具出现了但界面初始化失败，怎么撤销？","a":"先把工具和界面加入暂存批次，所有准备成功后统一发布。准备失败撤销暂存并释放资源，普通读者从未看见这批半成品。","tags":["事务","UI"],"target":"scenarios","scenario":"transaction"},{"q":"注册事务能回滚数据库写入吗？","a":"不能自动做到。注册事务控制能力的可见性；外部写入必须由业务事务、补偿或幂等策略管理。候选预热阶段应限制共享状态写入。","tags":["事务","数据"],"target":"upgrade"},{"q":"热升级只冻结工具 Schema 够吗？","a":"还要冻结执行目标。否则旧 Step 依据旧参数定义生成的调用，可能被路由到新版本处理器。租约应同时持有定义、目标和生命周期。","tags":["升级","快照"],"target":"scenarios","scenario":"upgrade"},{"q":"旧版本一直有任务，能无限等吗？","a":"需要选择排空政策：有界等待到期取消，或明确保留旧运行环境并让用户管理。期限应结合任务预算，不能靠无限延长资源寿命解决。","tags":["排空","超时"],"target":"decisions","decision":"D10"},{"q":"新版本提交后坏了，切回代码就行吗？","a":"还要检查数据格式和已经发生的副作用。准备失败保留旧版本比较直接；提交后的回退必须定义兼容性、写入权交接和恢复策略。","tags":["回滚","数据"],"target":"upgrade"},{"q":"Context 可以完整通过 RPC 传过去吗？","a":"应拆成受控协议。生命周期回调和资源留在本进程，服务调用传可序列化值，函数由 SDK 绑定为处理器 ID。宿主保持权威注册和身份。","tags":["RPC","Context"],"target":"interfaces"},{"q":"请求里写上 pluginId 就能确认身份吗？","a":"调用方可以伪造字段。宿主应从已经认证并绑定的连接读取实例、激活与作用域，再结合权限判定。请求只能引用它有权操作的资源。","tags":["权限","RPC"],"target":"interfaces"},{"q":"Node 子进程是不是安全沙箱？","a":"它能帮助隔离进程故障和执行寿命，但默认仍可能访问本机文件、网络和凭证。首版只执行可信插件；开放任意代码前需真正的系统隔离。","tags":["安全","进程"],"target":"interfaces"},{"q":"为什么事件不承担所有业务请求？","a":"请求需要明确的处理者、结果、超时与错误契约。通知适合观察状态变化；把授权、返回值和通知混在同一个事件里会让行为依赖隐含顺序。","tags":["事件","服务"],"target":"mechanisms","topic":"events"},{"q":"运行状态如何保存到下次启动？","a":"保存实例配置、启用状态、版本和业务事实；进程、Promise、Context 和连接对象重新创建。未完成操作需要标记中断并判断是否可安全恢复。","tags":["持久化","恢复"],"target":"decisions","decision":"D11"},{"q":"关窗口和退出应用，插件都应该停止吗？","a":"这是尚需决定的产品运行策略。关闭窗口可以保留后台运行；退出进程则需要关闭或移交 Runtime。不要在没有明确策略时让两者隐式等价。","tags":["后台","桌面"],"target":"decisions","decision":"D11"},{"q":"先写哪一部分，最容易验证方向？","a":"先运行现有 Cordis 测试与生命周期样例，再映射 Workspace、产品实例和原生状态。接着做 Tools / Views 注册服务，最后接入进程、模型与界面。","tags":["路线","测试"],"target":"roadmap"},{"q":"要直接复制 Cordis 的全部 API 吗？","a":"已决定直接引入 Cordis core 并维护本地分支。原生 API 沿用源码；后续可以修改并补回归测试。产品的 Workspace、RPC 和注册发布仍要补充。","tags":["Cordis","选型"],"target":"sources"},{"q":"如何知道失败后有没有遗留资源？","a":"让诊断快照关联 instance、activation、依赖、注册数量和待清理资源。测试里检查释放后的计数与迟到消息，而不只检查状态变成 stopped。","tags":["诊断","资源"],"target":"decisions","decision":"D12"}]}</script>

e: archify-blueprint-node-pulse;\n      animation-duration: 3.8s;\n    }\n    svg[data-preset=\"editorial\"][data-animation=\"trace\"] [data-animate=\"edge\"] {\n      filter: none;\n      animation-duration: 2.2s;\n    }\n    svg[data-preset=\"editorial\"][data-animation=\"trace\"] [data-animate=\"node\"] {\n      animation-name: archify-editorial-node-pulse;\n      animation-duration: 3.5s;\n    }\n    /* Embedded proofs are static until a named Story Trail chapter is played.\n       This keeps proof grids calm and ensures ?play=1 stops all viewer motion\n       after one 3.2 second chapter instead of leaving ambient trace loops on. */\n    html[data-embed=\"true\"] svg[data-animation=\"trace\"] [data-animate],\n    html[data-share-playback=\"true\"] svg[data-animation=\"trace\"] [data-animate] {\n      animation: none !important;\n      stroke-dashoffset: 0;\n    }\n    @keyframes archify-edge-flow {\n      0% { stroke-dasharray: 10 8; stroke-dashoffset: 54; opacity: 0.42; }\n      88% { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }\n      99.9% { stroke-dasharray: 10 8; stroke-dashoffset: 0; opacity: 1; }\n      100% { stroke-dashoffset: 0; opacity: 1; }\n    }\n    @keyframes archify-node-pulse {\n      0%, 72%, 100% { filter: none; stroke-width: 1.5; }\n      18%, 36% {\n        filter: drop-shadow(0 0 8px var(--arrow-emphasis));\n        stroke-width: 2.4;\n      }\n    }\n    @keyframes archify-blueprint-node-pulse {\n      0%, 72%, 100% { opacity: 1; filter: none; }\n      18%, 36% { opacity: 0.72; filter: drop-shadow(0 0 2px var(--frontend-stroke)); }\n    }\n    @keyframes archify-editorial-node-pulse {\n      0%, 72%, 100% { opacity: 1; filter: none; }\n      18%, 36% { opacity: 0.78; filter: drop-shadow(0 2px 2px color-mix(in srgb, var(--text) 18%, transparent)); }\n    }\n    @keyframes archify-signal-scan {\n      0%, 18% { opacity: 1; transform: translateX(-70%); }\n      70% { opacity: 1; transform: translateX(70%); }\n      100% { opacity: 0; transform: translateX(70%); }\n    }\n    @keyframes archify-radar-live {\n      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--backend-stroke) 52%, transparent); }\n      55%, 100% { box-shadow: 0 0 0 0.32rem transparent; }\n    }\n    @keyframes archify-guided-progress {\n      from { transform: scaleX(var(--guided-progress-start, 0)); }\n      to { transform: scaleX(1); }\n    }\n    @keyframes archify-story-flow {\n      to { stroke-dashoffset: 0; }\n    }\n    @keyframes archify-intent-trace-flow {\n      0% { opacity: 0.28; stroke-dashoffset: 0; }\n      12%, 78% { opacity: 0.94; }\n      100% { opacity: 0; stroke-dashoffset: -1; }\n    }\n    @keyframes archify-route-probe-flow {\n      0% { stroke-dashoffset: 0; opacity: 0.96; }\n      78% { stroke-dashoffset: -1; opacity: 0.96; }\n      100% { stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0.58; }\n    }\n    @keyframes archify-route-journey-flow {\n      0% { opacity: 0.16; stroke-dashoffset: 0; }\n      14%, 76% { opacity: 1; }\n      100% { opacity: 0; stroke-dashoffset: -1; }\n    }\n    @keyframes archify-semantic-lens-flow {\n      0% { opacity: 0.2; stroke-dashoffset: 0; }\n      12%, 78% { opacity: 0.9; }\n      100% { opacity: 0; stroke-dashoffset: -1; }\n    }\n    @keyframes archify-relationship-pulse {\n      0% { opacity: 0.18; stroke-dashoffset: 0; }\n      10%, 76% { opacity: 0.98; }\n      100% { opacity: 0; stroke-dashoffset: -1; }\n    }\n    @keyframes archify-relationship-token-life {\n      0%, 7% { opacity: 0; }\n      13%, 82% { opacity: 1; }\n      100% { opacity: 0; }\n    }\n    @keyframes archify-story-beat-node {\n      from { opacity: 0.48; filter: saturate(0.6); }\n      58% { opacity: 1; filter: drop-shadow(0 0 10px var(--frontend-stroke)); }\n      to { opacity: 1; filter: drop-shadow(0 0 7px var(--frontend-stroke)); }\n    }\n    @keyframes archify-share-cue-enter {\n      from { opacity: 0; transform: translate(-50%, -0.45rem); }\n      to { opacity: 1; transform: translate(-50%, 0); }\n    }\n    @keyframes archify-share-cue-pulse {\n      0%, 100% { opacity: 1; transform: scale(1); }\n      50% { opacity: 0.48; transform: scale(0.78); }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      html[data-preset=\"signal-flow\"] .diagram-container::before {\n        animation: none !important;\n      }\n      .pulse-dot { animation: none !important; }\n      svg[data-animation=\"trace\"] [data-animate] {\n        animation: none !important;\n        stroke-dashoffset: 0;\n      }\n      .guided-view-progress span {\n        animation: none !important;\n        transform: scaleX(1) !important;\n      }\n      .story-trail-flow,\n      .intent-trace-flow,\n      .route-probe-flow,\n      .semantic-lens,\n      .diagram-guide,\n      [data-story-step],\n      .overview-map-live,\n      .guided-view-stop,\n      .share-chapter-cue,\n      .chapter-handoff-anchor,\n      .share-chapter-state::before,\n      .share-chapter-progress span { animation: none !important; }\n      .guided-view-chapter,\n      svg[data-chapter-preview] [data-node-id],\n      svg[data-chapter-preview] [data-edge-from] { transition: none !important; }\n      svg[data-story-playing=\"true\"] .story-trail-flow {\n        stroke-dasharray: none;\n        stroke-dashoffset: 0;\n        opacity: 0.55;\n      }\n      .intent-trace-flow {\n        animation: none !important;\n        stroke-dasharray: none;\n        stroke-dashoffset: 0;\n        opacity: 0.72;\n      }\n      .route-probe-flow {\n        animation: none !important;\n        stroke-dasharray: none;\n        stroke-dashoffset: 0;\n        opacity: 0.78;\n      }\n      .route-journey-overlay,\n      .story-carrier-overlay { display: none !important; }\n      .semantic-lens-flow {\n        animation: none !important;\n        stroke-dasharray: none;\n        stroke-width: 2.2;\n        opacity: 0.34;\n        filter: none;\n      }\n      .relationship-pulse-overlay { display: none !important; }\n      .guided-view-chapter { transition: none !important; }\n      .source-evidence-beacon,\n      svg [data-node-id], svg [data-edge-from], svg [data-detail], svg [data-detail-anchor], svg [data-legend-hit], svg { transition: none !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003c!-- Toolbar: theme, live visual style, trace motion, presentation stage, and export.\n       Motion appears only for trace-enabled artifacts and has no shortcut;\n       Keyboard: T toggles theme, S cycles style, F toggles the stage, E opens export. -->\n  \u003cdiv class=\"toolbar\" role=\"toolbar\" aria-label=\"图表操作\">\n    \u003cbutton id=\"btn-theme\" type=\"button\"\n            title=\"切换主题（T）\"\n            aria-label=\"切换颜色主题\"\n            aria-pressed=\"false\">\n      \u003cspan id=\"theme-icon\" class=\"toolbar-icon\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan id=\"theme-label\">深色\u003c/span>\n    \u003c/button>\n    \u003cdiv class=\"preset-wrap\">\n      \u003cbutton id=\"btn-preset\" type=\"button\"\n              title=\"选择视觉风格（S 循环切换）\"\n              aria-label=\"选择视觉风格\"\n              aria-haspopup=\"menu\"\n              aria-expanded=\"false\"\n              aria-controls=\"preset-menu\"\n              aria-keyshortcuts=\"S\">\n        \u003cspan class=\"preset-control-mark\" aria-hidden=\"true\">\u003c/span>\n        \u003cspan id=\"preset-label\">风格\u003c/span>\n        \u003cspan class=\"toolbar-icon toolbar-chevron\" aria-hidden=\"true\">\u003c/span>\n      \u003c/button>\n      \u003cdiv class=\"preset-menu\" id=\"preset-menu\" role=\"menu\" aria-label=\"视觉风格\">\n        \u003cdiv class=\"preset-menu-heading\" role=\"presentation\">\u003cspan>视觉表达\u003c/span>\u003cspan>S 循环切换\u003c/span>\u003c/div>\n        \u003cbutton class=\"preset-option\" data-preset-value=\"classic\" type=\"button\" role=\"menuitemradio\" aria-checked=\"false\" tabindex=\"-1\">\n          \u003cspan class=\"preset-option-swatch classic\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan class=\"preset-option-copy\">\u003cstrong>经典\u003c/strong>\u003csmall>稳定的技术默认风格\u003c/small>\u003c/span>\n          \u003cspan class=\"preset-option-check\" aria-hidden=\"true\">\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"preset-option\" data-preset-value=\"signal-flow\" type=\"button\" role=\"menuitemradio\" aria-checked=\"false\" tabindex=\"-1\">\n          \u003cspan class=\"preset-option-swatch signal-flow\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan class=\"preset-option-copy\">\u003cstrong>信号流\u003c/strong>\u003csmall>突出动态流向\u003c/small>\u003c/span>\n          \u003cspan class=\"preset-option-check\" aria-hidden=\"true\">\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"preset-option\" data-preset-value=\"blueprint\" type=\"button\" role=\"menuitemradio\" aria-checked=\"false\" tabindex=\"-1\">\n          \u003cspan class=\"preset-option-swatch blueprint\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan class=\"preset-option-copy\">\u003cstrong>蓝图\u003c/strong>\u003csmall>工程评审\u003c/small>\u003c/span>\n          \u003cspan class=\"preset-option-check\" aria-hidden=\"true\">\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"preset-option\" data-preset-value=\"editorial\" type=\"button\" role=\"menuitemradio\" aria-checked=\"false\" tabindex=\"-1\">\n          \u003cspan class=\"preset-option-swatch editorial\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan class=\"preset-option-copy\">\u003cstrong>编辑风格\u003c/strong>\u003csmall>适合发布与上线说明\u003c/small>\u003c/span>\n          \u003cspan class=\"preset-option-check\" aria-hidden=\"true\">\u003c/span>\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cbutton id=\"btn-motion\" type=\"button\" hidden\n            title=\"暂停动效\"\n            aria-label=\"暂停动效\"\n            aria-pressed=\"true\">\n      \u003cspan class=\"motion-control-dot\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan id=\"motion-label\">动态\u003c/span>\n    \u003c/button>\n    \u003cbutton id=\"btn-present\" type=\"button\"\n            title=\"演示模式（F）\"\n            aria-label=\"进入演示模式\"\n            aria-pressed=\"false\">\n      \u003cspan id=\"present-icon\" class=\"toolbar-icon\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan id=\"present-label\">演示\u003c/span>\n    \u003c/button>\n    \u003cdiv class=\"export-wrap\">\n      \u003cbutton id=\"btn-export\" type=\"button\"\n              title=\"导出图表（E）\"\n              aria-label=\"导出图表\"\n              aria-haspopup=\"menu\"\n              aria-expanded=\"false\"\n              aria-controls=\"export-menu\">\n        导出 \u003cspan class=\"toolbar-icon toolbar-chevron\" aria-hidden=\"true\">\u003c/span>\n      \u003c/button>\n      \u003cdiv class=\"export-menu\" id=\"export-menu\" role=\"menu\" aria-label=\"导出\">\n        \u003cdiv class=\"export-menu-header\" role=\"presentation\">\n          \u003cdiv>\u003cstrong>导出图表\u003c/strong>\u003cspan>便携、整洁的输出\u003c/span>\u003c/div>\n          \u003ckbd>E\u003c/kbd>\n        \u003c/div>\n        \u003cdiv class=\"export-menu-section\" role=\"group\" aria-label=\"分享\">\n          \u003cspan class=\"export-menu-heading\" aria-hidden=\"true\">分享\u003c/span>\n          \u003cbutton data-format=\"share-card\" type=\"button\" role=\"menuitem\" tabindex=\"-1\">\u003cspan class=\"export-item-copy\">\u003cstrong>分享卡片\u003c/strong>\u003csmall class=\"hint\">1200&times;630 PNG\u003c/small>\u003c/span>\u003c/button>\n          \u003cbutton data-action=\"route-share-card\" type=\"button\" role=\"menuitem\" tabindex=\"-1\" hidden disabled>\u003cspan class=\"export-item-copy\">\u003cstrong>路径分享卡片\u003c/strong>\u003csmall class=\"hint\">1200&times;630 PNG\u003c/small>\u003c/span>\u003c/button>\n          \u003cbutton data-action=\"reach-share-card\" type=\"button\" role=\"menuitem\" tabindex=\"-1\" hidden disabled>\u003cspan class=\"export-item-copy\">\u003cstrong> obe-copy\">\n            \u003cspan class=\"route-probe-eyebrow\">路径探测\u003c/span>\n            \u003cstrong class=\"route-probe-title\" id=\"route-probe-title\">选择起点节点\u003c/strong>\n          \u003c/span>\n          \u003cspan class=\"route-probe-actions\">\n            \u003cbutton class=\"route-probe-find\" id=\"route-probe-find\" type=\"button\" aria-label=\"查找路径起点\" data-node-finder-trigger>查找起点\u003c/button>\n            \u003cbutton class=\"route-probe-copy-link\" id=\"route-probe-copy\" type=\"button\" aria-label=\"复制已追踪路径的链接\" hidden>复制链接\u003c/button>\n            \u003cbutton id=\"route-probe-clear\" type=\"button\" aria-label=\"清除路径探测\">清除\u003c/button>\n          \u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"route-probe-path\" id=\"route-probe-path\" aria-label=\"已追踪路径\">\n          \u003cspan class=\"route-probe-placeholder\">在图表中选择两个语义节点\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"route-journey-controls\" id=\"route-journey-controls\" hidden role=\"group\" aria-label=\"路径旅程控制\" data-playing=\"false\">\n          \u003cbutton id=\"route-journey-prev\" type=\"button\" aria-label=\"上一个路径位置\" title=\"上一个路径位置\">&#8592;\u003c/button>\n          \u003cbutton class=\"route-journey-play\" id=\"route-journey-play\" type=\"button\" aria-label=\"播放路径旅程\" aria-pressed=\"false\" title=\"播放路径旅程\">\n            \u003cspan id=\"route-journey-play-icon\" aria-hidden=\"true\">&#9654;\u003c/span>\n            \u003cspan id=\"route-journey-play-label\">旅程\u003c/span>\n          \u003c/button>\n          \u003cbutton id=\"route-journey-next\" type=\"button\" aria-label=\"下一个路径位置\" title=\"下一个路径位置\">&#8594;\u003c/button>\n          \u003cbutton class=\"route-journey-overview\" id=\"route-journey-overview\" type=\"button\" aria-label=\"显示完整路径总览\" title=\"显示完整路径总览\">总览\u003c/button>\n        \u003c/div>\n        \u003csmall class=\"route-probe-status\" id=\"route-probe-status\" aria-live=\"polite\">先选择来源，再选择目标；方向很重要。\u003c/small>\n      \u003c/div>\n      \u003cdiv class=\"semantic-lens no-print\" id=\"semantic-lens\" hidden role=\"dialog\" aria-modal=\"false\" aria-labelledby=\"semantic-lens-title\">\n        \u003cdiv class=\"semantic-lens-head\">\n          \u003cspan>\n            \u003cspan class=\"semantic-lens-eyebrow\">语义透镜\u003c/span>\n            \u003cstrong class=\"semantic-lens-title\" id=\"semantic-lens-title\">比较系统角色\u003c/strong>\n          \u003c/span>\n          \u003cbutton class=\"semantic-lens-close\" id=\"semantic-lens-close\" type=\"button\" aria-label=\"关闭语义透镜\">&#215;\u003c/button>\n        \u003c/div>\n        \u003cp class=\"semantic-lens-instruction\">最多选择两种语义类型。选择一种可显示其真实流量；选择两种只比较直接编写的关系。\u003c/p>\n        \u003cdiv class=\"semantic-lens-kinds\" id=\"semantic-lens-kinds\" role=\"group\" aria-label=\"语义类型\">\u003c/div>\n        \u003cp class=\"semantic-lens-status\" id=\"semantic-lens-status\" aria-live=\"polite\">选择一种类型以检查其节点和相连关系。\u003c/p>\n        \u003cdiv class=\"semantic-lens-actions\">\n          \u003cbutton id=\"semantic-lens-copy\" type=\"button\" aria-label=\"复制语义透镜链接\" hidden>复制链接\u003c/button>\n          \u003cbutton id=\"semantic-lens-clear\" type=\"button\" aria-label=\"清除语义透镜\">清除\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"overview-map no-print\" id=\"overview-map\" hidden role=\"region\" aria-labelledby=\"overview-map-title\">\n        \u003cdiv class=\"overview-map-head\">\n          \u003cspan class=\"overview-map-live\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan class=\"overview-map-copy\">\n            \u003cstrong id=\"overview-map-title\">语义雷达\u003c/strong>\n            \u003csmall id=\"overview-map-status\" aria-live=\"polite\">正在构建总览\u003c/small>\n          \u003c/span>\n          \u003cbutton class=\"overview-map-expand\" id=\"overview-map-expand\" type=\"button\" aria-label=\"打开完整语义雷达\">打开雷达\u003c/button>\n          \u003cbutton class=\"overview-map-close\" id=\"overview-map-close\" type=\"button\" aria-label=\"关闭语义雷达\">&#215;\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"overview-map-surface\" id=\"overview-map-surface\" tabindex=\"0\" role=\"group\" aria-label=\"图表总览。点击节点进行聚焦，或使用方向键平移。\">\u003c/div>\n        \u003cdiv class=\"overview-map-hint\" aria-hidden=\"true\">\u003cspan>点击节点\u003c/span>\u003cspan>拖动平移\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"overview-map-feedback no-print\" id=\"overview-map-feedback\" role=\"status\" aria-live=\"polite\" hidden>语义雷达需要更多地图可见空间。\u003c/p>\n      \u003cdiv class=\"diagram-nav no-print\" role=\"toolbar\" aria-label=\"图表视图控制\">\n        \u003cbutton id=\"btn-route-probe\" type=\"button\" aria-label=\"追踪有向路径\" aria-pressed=\"false\" aria-controls=\"route-probe\" title=\"追踪路径（R）\">路径\u003c/button>\n        \u003cbutton id=\"btn-overview-map\" type=\"button\" aria-label=\"打开语义雷达\" aria-expanded=\"false\" aria-controls=\"overview-map\" title=\"语义雷达（M）\">地图\u003c/button>\n        \u003cbutton id=\"btn-semantic-lens\" type=\"button\" aria-label=\"打开语义透镜\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-pressed=\"false\" aria-controls=\"semantic-lens\" title=\"语义透镜（L）\">透镜\u003c/button>\n        \u003cbutton id=\"btn-node-finder\" type=\"button\" aria-label=\"查找节点\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"node-finder\" title=\"查找节点（/）\" data-node-finder-trigger>\u003cspan class=\"diagram-nav-icon find\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton id=\"btn-diagram-guide\" type=\"button\" aria-label=\"打开图表指南\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"diagram-guide\" title=\"图表指南（?）\">\u003cspan class=\"diagram-nav-icon guide\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton data-view=\"out\" type=\"button\" aria-label=\"缩小\" title=\"缩小（-）\">\u003cspan class=\"diagram-nav-icon minus\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton data-view=\"reset\" type=\"button\" aria-label=\"重置图表视图\" title=\"重置视图（0）\">\u003cspan class=\"diagram-nav-detail\" data-view-detail hidden>阅读\u003c/span>\u003cspan class=\"diagram-nav-percent\" data-view-percent>100%\u003c/span>\u003c/button>\n        \u003cbutton data-view=\"in\" type=\"button\" aria-label=\"放大\" title=\"放大（+）\">\u003cspan class=\"diagram-nav-icon plus\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Info Cards -->\n    \u003cdiv class=\"cards\">\n\n    \u003c/div>\n\n  \u003c/div>\n\n  \u003cscript>\n    var Archify = {};\n    var archifyI18nData = (function () {\n      var node = document.getElementById('archify-i18n-data');\n      try { return JSON.parse(node ? node.textContent : '{}'); }\n      catch (_) { return { locale: 'en', messages: {} }; }\n    })();\n    Archify.locale = archifyI18nData.locale || 'en';\n\n    function viewerText(key, values) {\n      var messages = archifyI18nData.messages || {};\n      var template = Object.prototype.hasOwnProperty.call(messages, key) ? messages[key] : key;\n      return String(template).replace(/\\{([a-zA-Z0-9_]+)\\}/g, function (match, name) {\n        return values && Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : match;\n      });\n    }\n\n    function viewerCount(key, count, values) {\n      var suffix = Number(count) === 1 ? '.one' : '.other';\n      var payload = Object.assign({}, values || {}, { count: count });\n      return viewerText(key + suffix, payload);\n    }\n\n    function viewerKindLabel(value) {\n      var normalized = String(value || 'node').toLowerCase();\n      var knownKey = 'viewer.kind.' + normalized;\n      var known = viewerText(knownKey);\n      if (known !== knownKey) return known;\n      return normalized\n        .replace(/messagebus/gi, 'message bus')\n        .replace(/[-_]+/g, ' ')\n        .replace(/\\b\\w/g, function (letter) { return letter.toUpperCase(); });\n    }\n\n    function hasDrawableGeometry(element) {\n      if (!element) return false;\n      var geometries = /^(path|line|polyline)$/i.test(element.tagName)\n        ? [element]\n        : Array.prototype.slice.call(element.querySelectorAll('path, line, polyline'));\n      return geometries.some(function (geometry) {\n        var source = geometry.tagName.toLowerCase() === 'path'\n          ? geometry.getAttribute('d')\n          : geometry.tagName.toLowerCase() === 'polyline'\n            ? geometry.getAttribute('points')\n            : [geometry.getAttribute('x1'), geometry.getAttribute('y1'), geometry.getAttribute('x2'), geometry.getAttribute('y2')].join(' ');\n        if (!source || /(?:^|[^a-z])(?:nan|infinity)(?:[^a-z]|$)/i.test(source) || typeof geometry.getTotalLength !== 'function') return false;\n        try {\n          var length = Number(geometry.getTotalLength());\n          return Number.isFinite(length) && length > 0;\n        } catch (_) {\n          return false;\n        }\n      });\n    }\n\n    /* ============================================================\n       Visual style try-on — one topology, four bundled presets.\n       The reader's choice is intentionally session-only: it updates the\n       live page and canonical SVG together, but never rewrites the source,\n       URL, or a later diagram's authored default.\n       ============================================================ */\n    Archify.preset = (function () {\n      var PRESETS = ['classic', 'signal-flow', 'blueprint', 'editorial'];\n      var LABELS = {\n        classic: viewerText('viewer.preset.classic.short'),\n        'signal-flow': viewerText('viewer.preset.flow.short'),\n        blueprint: viewerText('viewer.preset.blueprint'),\n        editorial: viewerText('viewer.preset.editorial')\n      };\n      var html = document.documentElement;\n      var svg = document.querySelector('.diagram-container svg');\n      var btn = document.getElementById('btn-preset');\n      var label = document.getElementById('preset-label');\n      var menu = document.getElementById('preset-menu');\n      var options = function () {\n        return Array.prototype.slice.call(menu.querySelectorAll('[data-preset-value]'));\n      };\n      var authored = PRESETS.indexOf(html.getAttribute('data-preset')) >= 0\n        ? html.getAttribute('data-preset')\n        : 'classic';\n\n      function current() {\n        var value = html.getAttribute('data-preset');\n        return PRESETS.indexOf(value) >= 0 ? value : authored;\n      }\n      function nextAfter(preset) {\n        return PRESETS[(PRESETS.indexOf(preset) + 1) % PRESETS.length];\n      }\n      function apply(preset) {\n        if (html.getAttribute('data-embed') === 'true') return false;\n        if (PRESETS.indexOf(preset) \u003c 0) return false;\n        html.setAttribute('data-preset', preset);\n        svg.setAttribute('data-preset', preset);\n        btn.setAttribute('data-preset-option', preset);\n        label.textContent = LABELS[preset];\n        btn.setAttribute('aria-label', viewerText('viewer.preset.current', { style: LABELS[preset] }));\n        btn.title = viewerText('viewer.preset.choose.title');\n        options().forEach(function (option) {\n          var selected = option.getAttribute('data-preset-value') === preset;\n          option.setAttribute('aria-checked', String(selected));\n        });\n        return true;\n      }\n      function cycle() { return apply(nextAfter(current())); }\n\n      function isOpen() { return menu.classList.contains('open'); }\n      function open(focusLast) {\n        if (html.getAttribute('data-embed') === 'true') return false;\n        if (Archify.exportMenu && Archify.exportMenu.isOpen()) Archify.exportMenu.close(false);\n        menu.classList.add('open');\n        btn.setAttribute('aria-expanded', 'true');\n        var available = options();\n        var selected = available.find(function (option) { return option.getAttribute('aria-checked') === 'true'; });\n        var target = focusLast ? available[available.length - 1] : (selected || available[0]);\n        if (target) target.focus();\n        return true;\n      }\n      function close(focusTrigger) {\n        menu.classList.remove('open');\n        btn.setAttribute('aria-expanded', 'false');\n        if (focusTrigger) btn.focus();\n        return false;\n      }\n\n      apply(authored);\n      btn.addEventListener('click', function (e) {\n        e.stopPropagation();\n        if (isOpen()) close(false);\n        else open(false);\n      });\n      btn.addEventListener('keydown', function (e) {\n        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {\n          e.preventDefault();\n          if (!isOpen()) open(e.key === 'ArrowUp');\n        }\n      });\n      document.addEventListener('click', function (e) {\n        if (!menu.contains(e.target) && e.target !== btn) close(false);\n      });\n      menu.addEventListener('click', function (e) {\n        var option = e.target.closest('[data-preset-value]');\n        if (!option || !menu.contains(option)) return;\n        if (apply(option.getAttribute('data-preset-value'))) close(true);\n      });\n      menu.addEventListener('keydown', function (e) {\n        if (e.key === 'Escape') { e.preventDefault(); close(true); return; }\n        if (e.key === 'Tab') { close(false); return; }\n        var available = options();\n        var active = available.indexOf(document.activeElement);\n        switch (e.key) {\n          case 'ArrowDown':\n            e.preventDefault();\n            if (available.length) available[(active + 1 + available.length) % available.length].focus();\n            break;\n          case 'ArrowUp':\n            e.preventDefault();\n            if (available.length) available[(active - 1 + available.length) % available.length].focus();\n            break;\n          case 'Home':\n            e.preventDefault();\n            if (available[0]) available[0].focus();\n            break;\n          case 'End':\n            e.preventDefault();\n            if (available.length) available[available.length - 1].focus();\n            break;\n        }\n      });\n      return { cycle: cycle, apply: apply, current: current, authored: authored, open: open, close: close, isOpen: isOpen };\n    })();\n\n    /* ============================================================\n       Theme toggle — persists to localStorage, respects system pref\n       ============================================================ */\n\n    Archify.theme = (function () {\n      var STORAGE_KEY = 'archify-theme';\n      var html = document.documentElement;\n      var btn = document.getElementById('btn-theme');\n      var label = document.getElementById('theme-label');\n\n      // localStorage can throw (blocked cookies, sandboxed iframes); the whole\n      // script element dies on an uncaught error, so guard every access.\n      function readStored() {\n        try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }\n      }\n      function writeStored(value) {\n        try { localStorage.setItem(STORAGE_KEY, value); } catch (_) {}\n      }\n      function urlOverride() {\n        // URL param wins (useful for deterministic screenshots / share links)\n        try {\n          var param = new URLSearchParams(window.location.search).get('theme');\n          if (param === 'light' || param === 'dark') return param;\n        } catch (_) {}\n        return null;\n      }\n\n      function resolveInitial() {\n        var fromUrl = urlOverride();\n        if (fromUrl) return fromUrl;\n        var saved = readStored();\n        if (saved === 'light' || saved === 'dark') return saved;\n        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';\n      }\n\n      function apply(theme) {\n        html.setAttribute('data-theme', theme);\n        label.textContent = viewerText(theme === 'dark' ? 'viewer.theme.dark' : 'viewer.theme.light');\n        btn.setAttribute('aria-pressed', theme === 'light
